name: profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rebuild packet + activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py
      - name: commit
        run: |
          git config user.name "crypthium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/crypthium.pcap assets/packet.svg assets/live.svg
          git diff --cached --quiet || git commit -m "chore: daily packet"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#24292f&color_dots=#ebedf0,#c6cbd1,#959da5,#6a737d,#24292f
            dist/snake-dark.svg?palette=github-dark&color_snake=#c9d1d9
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
